<text x="750" y="416" text-anchor="middle" fill="#5B6B66" font-family="Arial,Helvetica,sans-serif" font-size="13">Web + Mobile → NestJS API → PostgreSQL/PostGIS → Search / Storage / Realtime / Payments / Jobs</text>
