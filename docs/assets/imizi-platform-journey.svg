<text x="70" y="72" fill="#0E9F6E" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="800" letter-spacing="3">CONNECTED PRODUCT JOURNEY</text>
<text x="70" y="112" fill="#0B1210" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="800">One account, one property context, one transaction trail.</text>
