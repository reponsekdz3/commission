<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 460" role="img" aria-labelledby="title desc">
<title id="title">Imizi connected product journey</title><desc id="desc">A six-step product journey from discovery to operations connected to shared backend foundations.</desc>
