services:
  postgres:
    image: postgres:16-alpine
    container_name: imizi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: imizi
      POSTGRES_PASSWORD: imizi_dev
      POSTGRES_DB: imizi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imizi -d imizi"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - imizi-network

  redis:
    image: redis:7-alpine
    container_name: imizi-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - imizi-network

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: imizi-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql://imizi:[REDACTED]@postgres:5432/imizi?schema=public
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
    ports:
      - "4000:4000"
    networks:
      - imizi-network

volumes:
  pgdata:
  redisdata:

networks:
  imizi-network:
    driver: bridge
