services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: imizi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: imizi
      POSTGRES_PASSWORD: imizi_dev
      POSTGRES_DB: imizi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imizi -d imizi"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: imizi-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    container_name: imizi-opensearch
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - osdata:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: imizi-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: imizi
      MINIO_ROOT_PASSWORD: imizi_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:latest
    container_name: imizi-minio-init
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./infra/storage/cors.xml:/tmp/cors.xml:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mc alias set local http://minio:9000 imizi imizi_secret &&
        mc mb --ignore-existing local/imizi-public &&
        mc mb --ignore-existing local/imizi-private &&
        mc anonymous set download local/imizi-public &&
        mc cors set local/imizi-public /tmp/cors.xml &&
        mc cors set local/imizi-private /tmp/cors.xml

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: imizi-prometheus
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.3.0
    container_name: imizi-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: imizi
    volumes:
      - grafanadata:/var/lib/grafana

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: imizi-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql://imizi:imizi_dev@postgres:5432/imizi?schema=public
      REDIS_URL: redis://redis:6379
      OPENSEARCH_URL: http://opensearch:9200
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: imizi
      S3_SECRET_KEY: imizi_secret
      MAPS_PROVIDER: catalog
    ports:
      - "4000:4000"

volumes:
  pgdata:
  redisdata:
  osdata:
  miniodata:
  grafanadata:
