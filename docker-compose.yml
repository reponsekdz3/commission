services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: imizi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: imizi
      POSTGRES_PASSWORD: imizi_dev
      POSTGRES_DB: imizi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imizi -d imizi"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: imizi-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  opensearch:
    image: opensearchproject/opensearch:2.13.0
    container_name: imizi-opensearch
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - osdata:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio:
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    container_name: imizi-minio
    user: "0:0"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: imizi
      MINIO_ROOT_PASSWORD: imizi_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:latest
    container_name: imizi-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mc alias set local http://minio:9000 imizi imizi_secret &&
        mc mb --ignore-existing local/imizi-public &&
        mc mb --ignore-existing local/imizi-private &&
        mc anonymous set download local/imizi-public &&
        echo "MinIO buckets initialized"

  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: imizi-prometheus
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.3.0
    container_name: imizi-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: imizi
    volumes:
      - grafanadata:/var/lib/grafana

  db-migrate:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: imizi-db-migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://imizi:imizi_dev@postgres:5432/imizi?schema=public
    command: ["node", "packages/database/src/migrate.cjs"]

  db-seed:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: imizi-db-seed
    restart: "no"
    profiles: ["seed"]
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://imizi:imizi_dev@postgres:5432/imizi?schema=public
      SEED_PASSWORD: ${SEED_PASSWORD:-ChangeMeLocalOnly2026!}
    command: ["node", "packages/database/src/seed.cjs"]

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: imizi-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      db-migrate:
        condition: service_completed_successfully
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql://imizi:imizi_dev@postgres:5432/imizi?schema=public
      REDIS_URL: redis://redis:6379
      OPENSEARCH_URL: http://opensearch:9200
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: imizi
      S3_SECRET_KEY: imizi_secret
      MAPS_PROVIDER: catalog
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
        NEXT_PUBLIC_MAPBOX_TOKEN: ${NEXT_PUBLIC_MAPBOX_TOKEN:-}
    container_name: imizi-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/',(r)=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
  osdata:
  miniodata:
  grafanadata:
