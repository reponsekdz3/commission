version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: imizi-postgres
    environment:
      POSTGRES_USER: imizi
      POSTGRES_PASSWORD: imizi_dev
      POSTGRES_DB: imizi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imizi"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - imizi

  redis:
    image: redis:7-alpine
    container_name: imizi-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - imizi

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: imizi-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://imizi:[REDACTED]@postgres:5432/imizi?schema=public
      REDIS_URL: redis://redis:6379
      API_URL: http://localhost:4000
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    ports:
      - "4000:4000"
    networks:
      - imizi

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    container_name: imizi-web
    depends_on:
      api:
        condition: service_started
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://api:4000/api/v1
    ports:
      - "3000:3000"
    networks:
      - imizi

volumes:
  pgdata:
  redisdata:

networks:
  imizi:
    driver: bridge
