name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API • typecheck • test • build • DB smoke • health
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: imizi
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d imizi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      opensearch:
        image: opensearchproject/opensearch:2.19.0
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports: ["9200:9200"]
        options: >-
          --health-cmd "curl -fsS http://localhost:9200/_cluster/health"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/imizi
      REDIS_URL: redis://localhost:6379
      OPENSEARCH_URL: http://localhost:9200
      OPENSEARCH_INDEX: imizi-listings
      NODE_ENV: test
      JWT_ACCESS_SECRET: ci-access-secret-abcdefghijklmnopqrstuvwxyz-123456
      JWT_REFRESH_SECRET: ci-refresh-secret-abcdefghijklmnopqrstuvwxyz-123456
      API_PREFIX: /api/v1
      DEFAULT_COUNTRY: RW
      DEFAULT_CURRENCY: RWF
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run db:smoke
      - name: Start API
        run: npm start -w @imizi/api > /tmp/imizi-api.log 2>&1 &
      - name: Wait for API
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4000/live >/tmp/live.json; then exit 0; fi
            sleep 2
          done
          cat /tmp/imizi-api.log
          exit 1
      - name: Readiness, auth and search smoke
        run: |
          curl -fsS http://127.0.0.1:4000/ready
          curl -fsS http://127.0.0.1:4000/metrics | grep -E "imizi_database_up|imizi_redis_up|imizi_search_up"
          LOGIN="$(curl -fsS -X POST http://127.0.0.1:4000/api/v1/auth/login -H 'content-type: application/json' -d '{"identifier":"tenant@imizi.rw","password":"ChangeMe!2026"}')"
          TOKEN="$(printf '%s' "$LOGIN" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).accessToken))')"
          test -n "$TOKEN"
          curl -fsS -H "Authorization: Bearer $TOKEN" http://127.0.0.1:4000/api/v1/notifications >/tmp/notifications.json
          curl -fsS "http://127.0.0.1:4000/api/v1/search?listingType=RENT&district=Kicukiro&limit=10" >/tmp/search.json
          node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("/tmp/search.json","utf8")); if(!Array.isArray(x.items)) process.exit(1); console.log("search smoke items:",x.items.length)'

  web:
    name: Web • typecheck • production build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4000/api/v1
      NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w @imizi/web
      - run: npm run build -w @imizi/web

  mobile:
    name: Mobile • TypeScript • Expo validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm install --no-audit --no-fund
      - name: Typecheck mobile
        working-directory: apps/mobile
        run: npm run typecheck
      - name: Validate Expo config
        working-directory: apps/mobile
        run: npx expo config --type public

  security:
    name: Security • dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
