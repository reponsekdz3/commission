name: CI

on:
  push:
    branches: [main, develop, "feat/**"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: imizi
          POSTGRES_PASSWORD: imizi_dev
          POSTGRES_DB: imizi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U imizi -d imizi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql://imizi:imizi_dev@localhost:5432/imizi?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-must-be-long-enough-32
      JWT_REFRESH_SECRET: ci-refresh-secret-must-be-long-enough-32
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run test:domain
      - run: npm run test -w @imizi/api --if-present
      - run: npm run typecheck --if-present
      - run: npm run build -w @imizi/domain
      - run: npm run build -w @imizi/api
      - run: npm run build -w @imizi/web
